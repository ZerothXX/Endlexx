[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "endlexx"
version = "0.1.0"
description = "Character creation agent workbench"
readme = "README.en.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0.38,<3", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "pillow>=11,<13", "numpy>=1.26,<3",
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4", "redis>=5,<7", "celery>=5.4,<6",
  "jieba>=0.42,<1", "rank-bm25>=0.2,<1", "filelock>=3.16,<4", "structlog>=25,<26",
  "mcp>=1.10,<2", "opencv-python-headless>=4.10,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["endlexx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

